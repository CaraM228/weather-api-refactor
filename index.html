<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API Refactor</title>
    <link rel="stylesheet" href="output.css">
    <script src="./dist/app.js" type="module" defer></script>
</head>
<body class="bg-sky-400 max-w-6xl mx-auto">
    <main>
        <header id="page-header" class="bg-blue-400 p-6 rounded-lg">
            <h1 id="title" class="text-2xl md:text-4xl font-bold p-4">Weather Forecast in Calgary</h1>
            <div class="flex justify-center gap-4 mt-4">
            <button id="toggle-btn" class="bg-white rounded-lg px-2 hover:bg-blue-100">Viewing: °C</button>
            <button id="mode-btn" class="bg-white rounded-lg px-2 hover:bg-blue-100">Mode: Dark</button>
            </div>
        </header>
        <p id="loading-message"></p>
        <p id="error-message" class="text-red-500 text-center"></p>

        <div id="weather-card-container" class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-8 px-4">
        </div>
    </main>
</body>
</html>
