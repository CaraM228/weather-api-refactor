<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API Refactor</title>
    <link rel="stylesheet" href="output.css">
    <script src="app.js" type="module" defer></script>
</head>
<body class="bg-sky-400 max-w-6xl mx-auto">
    <main>
        <header class="bg-blue-400 grid grid-cols-2 items-center p-4 rounded-lg">

            <button id="toggle-btn" class="bg-white justify-self-center rounded-lg px-2 hover:bg-blue-100">Viewing: °C</button>

        <p id="error-message" class="text-red-500 text-center"></p>

        <div id="weather-card-container" class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-8 px-4">
        </div>
    </main>
</body>
</html>
